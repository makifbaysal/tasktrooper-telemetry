name: Release Go

# Verifies a Go SDK tag and warms proxy.golang.org so pkg.go.dev picks the version up.
# Go modules are published by the tag itself; nothing is uploaded.
# Tags (create them with sdks/go/scripts/tag.sh <version>):
#   sdks/go/vX.Y.Z                       → root SDK
#   sdks/go/integrations/<name>/vX.Y.Z   → one integration module
# See sdks/go/README.md § Releasing.

on:
  push:
    tags:
      - "sdks/go/v*"
      - "sdks/go/integrations/*/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off" # each module must stand on its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - name: resolve module from tag
        id: mod
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG##*/}"
          dir="${TAG%/*}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG does not end in a semver version"; exit 1
          fi
          if [ ! -f "$dir/go.mod" ]; then
            echo "::error::no go.mod at $dir (tag $TAG)"; exit 1
          fi
          module="$(cd "$dir" && go list -m)"
          expected="github.com/${GITHUB_REPOSITORY}/${dir}"
          if [ "$module" != "$expected" ]; then
            echo "::error::module path $module does not match tag path $expected"; exit 1
          fi
          {
            echo "dir=$dir"
            echo "version=$version"
            echo "module=$module"
          } >> "$GITHUB_OUTPUT"
          echo "$module@$version"
      - name: vet + test
        working-directory: ${{ steps.mod.outputs.dir }}
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: warm module proxy
        env:
          MODULE: ${{ steps.mod.outputs.module }}
          VERSION: ${{ steps.mod.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org go list -m "$MODULE@$VERSION"; then
              exit 0
            fi
            echo "proxy not ready (attempt $i), retrying"
            sleep $((i * 15))
          done
          echo "::error::proxy.golang.org could not resolve $MODULE@$VERSION"
          exit 1
