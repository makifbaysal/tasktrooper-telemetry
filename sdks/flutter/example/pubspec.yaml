name: trooper_example
description: Example app for the TaskTrooper Flutter RUM SDK.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  http: ^1.6.0
  trooper_dio:
