name: tasktrooper_flutter
description: TaskTrooper Telemetry RUM SDK for Flutter. Tracks views, errors, network calls, frame vitals, app start, sessions and session replay.
version: 0.1.0
homepage: https://telemetry.tasktrooper.ai
repository: https://github.com/makifbaysal/tasktrooper-telemetry/tree/main/sdks/flutter/tasktrooper_flutter
issue_tracker: https://github.com/makifbaysal/tasktrooper-telemetry/issues
topics:
  - monitoring
  - observability
  - analytics
  - crash-reporting
  - performance

environment:
  sdk: ^3.11.4
  flutter: ">=3.27.0"

dependencies:
  clock: ^1.1.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.17.0
  path_provider: ^2.1.6
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Native side of the `dev.tasktrooper.telemetry/rum` channel (contracts.md §9). Other platforms
  # (web, desktop) have no implementation; the Dart SDK tolerates MissingPluginException.
  plugin:
    platforms:
      android:
        package: dev.tasktrooper.tasktrooper_flutter
        pluginClass: TrooperFlutterPlugin
      ios:
        pluginClass: TrooperFlutterPlugin
