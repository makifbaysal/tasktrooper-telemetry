{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trooper-agent.fullname" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ required "dsn is required (TT_DSN: <scheme>://<ingest key>@<host>/<project>)" .Values.dsn | quote }}
  apiKey: {{ .Values.apiKey | quote }}
{{- end }}
