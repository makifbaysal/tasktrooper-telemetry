{{- if and (not (include "trooper-agent.hasStatic" .)) (not .Values.apiUrl) }}
{{- fail "nothing to collect: enable an integration, set targets, or set apiUrl + apiKey" }}
{{- end }}
{{- $daemon := eq .Values.kind "DaemonSet" }}
apiVersion: apps/v1
kind: {{ ternary "DaemonSet" "Deployment" $daemon }}
metadata:
  name: {{ include "trooper-agent.fullname" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
spec:
  {{- if not $daemon }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "trooper-agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "trooper-agent.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "trooper-agent.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "trooper-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: trooper-agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if include "trooper-agent.hasStatic" . }}
            - --config=/etc/trooper-agent/config.yaml
            {{- end }}
            {{- if .Values.hostMetrics }}
            - --host-metrics
            {{- if $daemon }}
            - --host-disk-path=/host/root
            {{- end }}
            {{- end }}
          env:
            - name: TT_DSN
              valueFrom: { secretKeyRef: { name: {{ include "trooper-agent.secretName" . }}, key: dsn } }
            {{- if .Values.apiUrl }}
            - name: TT_API_URL
              value: {{ .Values.apiUrl | quote }}
            - name: TT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "trooper-agent.secretName" . }}, key: apiKey } }
            {{- end }}
            {{- with .Values.modes }}
            - name: TT_COLLECTOR_MODES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: TT_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if and .Values.hostMetrics $daemon }}
            - { name: HOST_PROC, value: /host/proc }
            - { name: HOST_SYS, value: /host/sys }
            {{- end }}
            {{- range $engine := list "postgres" "mysql" "redis" "mongodb" }}
            {{- $i := index $.Values.integrations $engine }}
            {{- if and $i.enabled $i.passwordSecret.name }}
            - name: TT_{{ upper $engine }}_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $i.passwordSecret.name }}, key: {{ default "password" $i.passwordSecret.key }} } }
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if include "trooper-agent.hasStatic" . }}
            - { name: config, mountPath: /etc/trooper-agent, readOnly: true }
            {{- end }}
            {{- if and .Values.hostMetrics $daemon }}
            - { name: host-proc, mountPath: /host/proc, readOnly: true }
            - { name: host-sys, mountPath: /host/sys, readOnly: true }
            - { name: host-root, mountPath: /host/root, readOnly: true }
            {{- end }}
            {{- range .Values.extraSecretMounts }}
            - { name: {{ .name }}, mountPath: {{ .mountPath }}, readOnly: true }
            {{- end }}
      volumes:
        {{- if include "trooper-agent.hasStatic" . }}
        - name: config
          configMap: { name: {{ include "trooper-agent.fullname" . }} }
        {{- end }}
        {{- if and .Values.hostMetrics $daemon }}
        - { name: host-proc, hostPath: { path: /proc } }
        - { name: host-sys, hostPath: { path: /sys } }
        - { name: host-root, hostPath: { path: / } }
        {{- end }}
        {{- range .Values.extraSecretMounts }}
        - name: {{ .name }}
          secret: { secretName: {{ .secretName }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
