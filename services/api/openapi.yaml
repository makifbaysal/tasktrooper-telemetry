      tags: [Serverless]
      operationId: getServerlessFunctions
      summary: 'AWS Lambda functions and Azure Function Apps with range metrics (most invoked first)'
      parameters:
        - $ref: '#/components/parameters/range'
        - { name: provider, in: query, schema: { type: string, enum: [aws, azure] } }
        - { name: q, in: query, description: 'Substring of name / slug / service / app', schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServerlessFunction' } } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/serverless/functions/{id}:
    get:
      tags: [Serverless]
      operationId: getServerlessFunction
      summary: 'Function detail (id or slug): the function row + series {invocations, duration, concurrency, coldStarts}, recent errors (spans), Azure functions, integration'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/range'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ServerlessFunctionDetail' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/monitor-templates:
    get:
      tags: [Alerting]
      operationId: getMonitorTemplates
      summary: 'Ready-made infra / faas monitors (kind + query + condition); create one with POST /monitors, source template'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MonitorTemplate' } } } } }
        '401': { $ref: '#/components/responses/E401' }
components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "Project API key (kind = api), e.g. tt_dev_api_key" }
    session: { type: apiKey, in: cookie, name: tt_session, description: "httpOnly session cookie (7 day sliding); project via X-Trooper-Project" }
  parameters:
    range: { name: range, in: query, description: "Time range (default 1h)", schema: { type: string, enum: [15m, 30m, 1h, 6h, 24h, 7d], default: 1h } }
    env: { name: env, in: query, description: "Deployment environment filter", schema: { type: string } }
    type: { name: type, in: query, description: "Service types, comma separated (http | worker | web | mobile)", schema: { type: string } }
    service: { name: service, in: query, description: "Service name (repeatable / comma separated on /logs)", schema: { type: string } }
    serviceId: { name: serviceId, in: query, schema: { type: string } }
    endpoint: { name: endpoint, in: query, description: '"METHOD /route" or a process name', schema: { type: string } }
    errors: { name: errors, in: query, description: "Only failed traces", schema: { type: boolean } }
    minMs: { name: minMs, in: query, description: "Minimum duration (ms)", schema: { type: number } }
    sort: { name: sort, in: query, schema: { type: string, enum: [recent, slowest] } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1 } }
    route: { name: route, in: query, schema: { type: string } }
    status: { name: status, in: query, schema: { type: string, enum: [open, resolved, ignored] } }
    level: { name: level, in: query, description: "error | warn | info | debug (repeatable / comma separated)", schema: { type: string } }
    q: { name: q, in: query, description: "Full-text search (single token uses the token index)", schema: { type: string } }
    traceId: { name: traceId, in: query, schema: { type: string } }
    before: { name: before, in: query, description: "Cursor: nextBefore of the previous page (unix µs)", schema: { type: integer } }
    view: { name: view, in: query, description: "Page / screen name", schema: { type: string } }
    kind: { name: kind, in: query, schema: { type: string } }
    clusterId: { name: clusterId, in: query, schema: { type: string } }
    group: { name: group, in: query, schema: { type: string } }
    state: { name: state, in: query, description: "open = not resolved (pending included)", schema: { type: string, enum: [open, pending, firing, acknowledged, resolved] } }
    deploySource: { name: source, in: query, schema: { type: string, enum: [spans, vercel, ci, manual, aws, gcp] } }
    monitorId: { name: monitorId, in: query, schema: { type: string } }
    kpiId: { name: kpiId, in: query, schema: { type: string } }
    since: { name: since, in: query, description: "Unix ms", schema: { type: integer } }
    metric: { name: metric, in: query, required: true, schema: { type: string, enum: [cpu, memory, disk, connections, ops, p95, hit, repl, slow, evictions] } }
    brokerMetric: { name: metric, in: query, required: true, schema: { type: string, enum: [cpu, memory, disk, net] } }
    node: { name: node, in: query, schema: { type: string } }
    cluster: { name: cluster, in: query, description: "Kubernetes cluster name ('' = not Kubernetes)", schema: { type: string } }
    namespace: { name: namespace, in: query, schema: { type: string } }
    topic: { name: topic, in: query, schema: { type: string } }
    by: { name: by, in: query, schema: { type: string, enum: [topic, partition] } }
    scenarioId: { name: scenarioId, in: query, schema: { type: string } }
  responses:
    E400: { description: Invalid parameter or body, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E401: { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E403: { description: Role too low or project not accessible, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E404: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E409: { description: Conflict (duplicate id or invalid state transition), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E500: { description: Internal error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    CodeSuggestion:
      type: object
      required: [id, title, kind, target, condition, criticality, confidence, rationale, codeRef, calibrated, state, createdAt, monitorDraft]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, description: 'Monitor kind' }
        target: { type: string }
        condition: { type: string }
        criticality: { type: string, enum: [critical, important, low] }
        confidence: { type: number }
        rationale: { type: string }
        codeRef: { type: string }
        calibrated: { type: boolean }
        state: { type: string, enum: [proposed, accepted, rejected] }
        createdAt: { type: integer }
        monitorId: { type: string, description: 'Monitor created on accept' }
        monitorDraft: { description: 'POST /monitors body that accept creates' }
    SuggestionAccept:
      type: object
      properties:
        name: { type: string }
        severity: { type: string }
        channels: { type: array, items: { type: string } }
        status: { type: string }
    SuggestionAccepted:
      type: object
      required: [suggestion, monitor]
      properties:
        suggestion: { $ref: '#/components/schemas/CodeSuggestion' }
        monitor: { $ref: '#/components/schemas/Monitor' }
    Repo:
      type: object
      required: [id, name, provider, branch, sha, analyzedAt, services, language, languages, status, lastAnalyzedSha, pendingPaths, webhookActive]
      properties:
        id: { type: string }
        name: { type: string, description: 'owner/repo' }
        provider: { type: string, enum: [github, gitlab, bitbucket, local] }
        branch: { type: string }
        sha: { type: string }
        analyzedAt: { type: integer, format: int64 }
        analyzeRequestedAt: { type: integer }
        services: { type: array, items: { type: string } }
        language: { type: string }
        languages: { type: array, items: { type: string } }
        status: { type: string, enum: [ready, analyzing, error, disconnected] }
        error: { type: string }
        installationId: { type: string }
        localPath: { type: string }
        lastAnalyzedSha: { type: string }
        pendingPaths: { type: [array, "null"], items: { type: string }, description: 'Files changed by pushes since the last analysis' }
        webhookActive: { type: boolean, description: 'Connected through the GitHub App (pushes trigger analyses)' }
        analysis: { type: object, description: 'codeintel summary of the last analysis: {sha, incremental, items, llmItems, llm: {status: ok|disabled|quota_exceeded, reason?, credits (2 decimals), skipped?}}' }
    RepoInput:
      type: object
      required: [provider, fullName]
      properties:
        provider: { type: string, enum: [github, gitlab, bitbucket, local] }
        fullName: { type: string }
        defaultBranch: { type: string }
        token: { type: string, writeOnly: true, description: 'Sealed, never returned' }
        installationId: { type: [integer, string], description: 'GitHub App installation of this project (no token needed)' }
        localPath: { type: string }
    InventoryItem:
      type: object
      required: [id, kind, key, service, file, line, criticality, observed, monitored, dead, shadow]
      properties:
        id: { type: string }
        repoId: { type: string }
        kind: { type: string, enum: [endpoint, consumer, cron, view, dependency] }
        key: { type: string, description: '"METHOD /route" or process name' }
        source: { type: string, description: 'Consumer: topic/queue; cron: schedule' }
        service: { type: string }
        file: { type: string }
        line: { type: integer }
        criticality: { type: string, enum: [critical, important, low] }
        observed: { type: boolean }
        monitored: { type: boolean }
        dead: { type: boolean, description: 'In code, no traffic for 30 days' }
        shadow: { type: boolean, description: 'Traffic, not in code' }
        summary: { type: string }
        analysis: { description: 'LLM interpretation (failure_modes, loadtest_hint)' }
    RcaStats:
      type: object
      required: [requests, rpm, avgMs, p50, p95, errorRate]
      properties:
        requests: { type: number }
        rpm: { type: number }
        avgMs: { type: number }
        p50: { type: number }
        p95: { type: number }
        errorRate: { type: number }
    RcaChildStats:
      type: object
      required: [calls, callsPerMin, callsPerReq, msPerReq, avgMs, p50, p95, errorRate]
      properties:
        calls: { type: number }
        callsPerMin: { type: number }
        callsPerReq: { type: number }
        msPerReq: { type: number, description: 'Dependency time per endpoint request' }
        avgMs: { type: number }
        p50: { type: number }
        p95: { type: number }
        errorRate: { type: number }
    RcaChild:
      type: object
      required: [dep, kind, current, baseline, deltaMsPerReq, share]
      properties:
        dep: { type: string }
        kind: { type: string, enum: [db, cache, http, queue] }
        current: { $ref: '#/components/schemas/RcaChildStats' }
        baseline: { $ref: '#/components/schemas/RcaChildStats' }
        deltaMsPerReq: { type: number, description: 'current − baseline ms per request' }
        share: { type: number, description: 'deltaMsPerReq / deltaAvgMs (0 when the average did not change)' }
    EndpointRca:
      type: object
      required: [service, endpoint, from, to, baselineFrom, baselineTo, current, baseline, ownMs, deltaAvgMs, children]
      properties:
        service: { type: string }
        endpoint: { type: string, description: '"METHOD /route" or process name' }
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        baselineFrom: { type: integer, format: int64 }
        baselineTo: { type: integer, format: int64 }
        current: { $ref: '#/components/schemas/RcaStats' }
        baseline: { $ref: '#/components/schemas/RcaStats' }
        ownMs: { type: array, minItems: 2, maxItems: 2, items: { type: number }, description: 'Own-code ms per request [current, baseline] = avg − Σ dependency ms (≥ 0)' }
        deltaAvgMs: { type: number }
        children: { type: array, items: { $ref: '#/components/schemas/RcaChild' }, description: 'Sorted by deltaMsPerReq descending' }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health_:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string }
    Health:
      type: string
      enum: [ok, warning, critical]
    ErrorStatusInput:
      type: object
      required: [status]
      properties:
        fingerprint: { type: string }
        status: { type: string, enum: [open, resolved, ignored] }
    Series:
      type: object
      required: [id, label, data]
      properties:
        id: { type: string }
        label: { type: string }
        data: { type: array, items: { type: number } }
    SeriesSet:
      type: object
      required: [timestamps, series]
      properties:
        timestamps: { type: array, items: { type: integer } }
        series: { type: array, items: { $ref: '#/components/schemas/Series' } }
    Service:
      type: object
      required: [id, name, type, language, version, rpm, errorRate, p95, prevRpm, prevErrorRate, prevP95, status, instances]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        language: { type: string }
        version: { type: string }
        rpm: { type: number }
        errorRate: { type: number }
        p95: { type: number }
        prevRpm: { type: number }
        prevErrorRate: { type: number }
        prevP95: { type: number }
        status: { $ref: '#/components/schemas/Health' }
        instances: { type: integer }
        lag: { type: number, description: "Consumer services only (summed group lag); omitted otherwise" }
        source: { type: string, enum: [sdk, ebpf], description: "ebpf = every entry span comes from eBPF instrumentation (OBI / Beyla)" }
        spark: { type: array, items: { type: number } }
    Subscription:
      type: object
      required: [process, source, topic, lag, retriesPerMin, dlqPerMin]
      properties:
        process: { type: string }
        source: { type: string }
        topic: { type: string }
        group: { type: string }
        partitions: { type: integer }
        schedule: { type: string }
        lag: { type: number }
        retriesPerMin: { type: number }
        dlqPerMin: { type: number }
    Endpoint:
      type: object
      required: [id, serviceId, method, route, rpm, errorRate, p50, p95, p99, monitored, criticality]
      properties:
        id: { type: string }
        serviceId: { type: string }
        method: { type: string }
        route: { type: string }
        rpm: { type: number }
        errorRate: { type: number }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
        monitored: { type: boolean }
        criticality: { type: string }
        sub: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: "null" }] }
        status: { oneOf: [{ $ref: '#/components/schemas/StatusCounts' }, { type: "null" }] }
        spark: { type: array, items: { type: number } }
    StatusCounts:
      type: object
      required: [s2xx, s3xx, s4xx, s5xx]
      properties:
        s2xx: { type: number }
        s3xx: { type: number }
        s4xx: { type: number }
        s5xx: { type: number }
    Dependency:
      type: object
      required: [id, serviceId, name, kind, avgMs, p95, errorRate, callsPerMin]
      properties:
        id: { type: string }
        serviceId: { type: string }
        name: { type: string }
        kind: { type: string }
        avgMs: { type: number }
        p95: { type: number }
        errorRate: { type: number }
        callsPerMin: { type: number }
    EndpointCall:
      type: object
      required: [dep, callsPerReq, msPerReq]
      properties:
        dep: { $ref: '#/components/schemas/Dependency' }
        callsPerReq: { type: number }
        msPerReq: { type: number }
    TimeBreakdown:
      type: object
      required: [avgMs, parts]
      properties:
        avgMs: { type: number }
        parts: { type: object, additionalProperties: { type: number } }
    Caller:
      type: object
      required: [id, name, kind, via]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        via: { type: string }
    CallerTraffic:
      type: object
      required: [caller, rpm, share, errorRate, p95]
      properties:
        caller: { $ref: '#/components/schemas/Caller' }
        rpm: { type: number }
        share: { type: number }
        errorRate: { type: number }
        p95: { type: number }
        topEndpoint: { oneOf: [{ $ref: '#/components/schemas/Endpoint' }, { type: "null" }] }
    TraceSummary:
      type: object
      required: [id, ts, dur, status, service, method, route, isError]
      properties:
        id: { type: string }
        ts: { type: integer }
        dur: { type: number }
        status: { type: integer }
        service: { type: string }
        method: { type: string }
        route: { type: string }
        isError: { type: boolean }
    Span:
      type: object
      required: [spanId, service, name, kind, category, start, dur, status, failed]
      properties:
        spanId: { type: string }
        parentSpanId: { type: string }
        service: { type: string }
        name: { type: string }
        kind: { type: string }
        category: { type: string }
        start: { type: number }
        dur: { type: number }
        status: { type: integer }
        failed: { type: boolean }
        dep: { type: string }
        route: { type: string }
        errorType: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
    Trace:
      type: object
      required: [id, ts, dur, services, errors, spans]
      properties:
        id: { type: string }
        ts: { type: integer }
        dur: { type: number }
        services: { type: array, items: { type: string } }
        errors: { type: integer }
        spans: { type: array, items: { $ref: '#/components/schemas/Span' } }
    ErrorIssue:
      type: object
      required: [fingerprint, service, type, message, route, firstSeen, lastSeen, count, status]
      properties:
        fingerprint: { type: string }
        service: { type: string }
        type: { type: string }
        message: { type: string }
        route: { type: string }
        firstSeen: { type: integer }
        lastSeen: { type: integer }
        count: { type: number }
        sampleTraceId: { type: string }
        status: { type: string }
    DeployMarker:
      type: object
      required: [service, env, version, ts, source]
      properties:
        service: { type: string }
        env: { type: string }
        version: { type: string }
        ts: { type: integer }
        source: { type: string, enum: [spans, vercel, ci, manual, aws, gcp] }
        url: { type: string }
        commitMessage: { type: string }
        author: { type: string }
        state: { type: string, enum: [building, ready, error, canceled] }
        integrationId: { type: string }
    Frame:
      type: object
      required: [fn, file, line, col, inApp]
      properties:
        fn: { type: string }
        file: { type: string }
        line: { type: integer }
        col: { type: integer }
        inApp: { type: boolean }
    ErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorIssue'
        - type: object
          required: [release, platform, stack, frames, symbolicated]
          properties:
            release: { type: string, description: "service.version of the latest occurrence" }
            platform: { type: string, description: "telemetry.sdk.language" }
            stack: { type: string }
            frames: { type: array, items: { $ref: '#/components/schemas/Frame' } }
            symbolicated: { type: boolean }
    LogLine:
      type: object
      required: [id, ts, level, service, message]
      properties:
        id: { type: string }
        ts: { type: integer }
        level: { type: string }
        service: { type: string }
        message: { type: string }
        traceId: { type: string }
        route: { type: string }
        source: { type: string, description: 'Vercel log source' }
    LogPage:
      type: object
      required: [lines, nextBefore, levels, services]
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/LogLine' } }
        nextBefore: { type: integer }
        levels: { type: object, additionalProperties: { type: number } }
        services: { type: object, additionalProperties: { type: number } }
    LogPattern:
      type: object
      required: [id, pattern, level, services, count, last]
      properties:
        id: { type: string }
        pattern: { type: string }
        level: { type: string }
        services: { type: array, items: { type: string } }
        count: { type: number }
        last: { type: integer }
    Vital:
      type: object
      required: [id, label, value, good, poor, unit]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: number }
        good: { type: number }
        poor: { type: number }
        unit: { type: string }
    AppSummary:
      type: object
      required: [activeUsers, prevActiveUsers, sessions, pageViewsPerMin, avgSessionSec, errorRate, prevErrorRate, vitals]
      properties:
        activeUsers: { type: number }
        prevActiveUsers: { type: number }
        sessions: { type: number }
        pageViewsPerMin: { type: number }
        avgSessionSec: { type: number }
        errorRate: { type: number }
        prevErrorRate: { type: number }
        vitals: { type: array, items: { $ref: '#/components/schemas/Vital' } }
    RumPage:
      type: object
      required: [id, path, views, users, avgTime, lcp, inp, cls, errorRate, bounce]
      properties:
        id: { type: string }
        path: { type: string }
        views: { type: number }
        users: { type: number }
        avgTime: { type: number }
        lcp: { type: number }
        inp: { type: number }
        cls: { type: number }
        errorRate: { type: number }
        bounce: { type: number }
    Session:
      type: object
      required: [id, user, identified, country, device, startedAt, duration, pages, errors, entry, exit]
      properties:
        id: { type: string }
        user: { type: string }
        identified: { type: boolean }
        country: { type: string }
        device: { type: string }
        startedAt: { type: integer }
        duration: { type: number }
        pages: { type: number }
        errors: { type: number }
        entry: { type: string }
        exit: { type: string }
    RumError:
      type: object
      required: [fingerprint, type, message, view, count, sessions, crash, firstSeen, lastSeen, appVersion]
      properties:
        fingerprint: { type: string }
        type: { type: string }
        message: { type: string }
        view: { type: string }
        count: { type: number }
        sessions: { type: number }
        crash: { type: boolean }
        firstSeen: { type: integer }
        lastSeen: { type: integer }
        appVersion: { type: string }
    RumErrorDetail:
      allOf:
        - $ref: '#/components/schemas/RumError'
        - type: object
          required: [app, platform, stack, frames, symbolicated]
          properties:
            app: { type: string }
            platform: { type: string }
            stack: { type: string }
            frames: { type: array, items: { $ref: '#/components/schemas/Frame' } }
            symbolicated: { type: boolean }
    RumResource:
      type: object
      required: [url, method, callsPerMin, errorRate, p50, p95]
      properties:
        url: { type: string }
        method: { type: string }
        callsPerMin: { type: number }
        errorRate: { type: number }
        p50: { type: number }
        p95: { type: number }
    AppStart:
      type: object
      required: [kind, count, p50, p75, p95]
      properties:
        kind: { type: string }
        count: { type: number }
        p50: { type: number }
        p75: { type: number }
        p95: { type: number }
    AppAPICall:
      type: object
      required: [endpoint, service, rpm, errorRate, p95]
      properties:
        endpoint: { $ref: '#/components/schemas/Endpoint' }
        service: { $ref: '#/components/schemas/Service' }
        rpm: { type: number }
        errorRate: { type: number }
        p95: { type: number }
    QueueRule:
      type: object
      required: [clusterId, group, metric, threshold, forMin]
      properties:
        clusterId: { type: string }
        group: { type: string }
        topic: { type: string }
        metric: { type: string, enum: [lag, time_behind, partition_lag, growing, not_drained, rebalances, oldest_age], description: "oldest_age: seconds (SQS / Pub/Sub / RabbitMQ)" }
        threshold: { type: number }
        forMin: { type: number }
    MonitorTarget:
      type: object
      properties:
        service: { type: string }
