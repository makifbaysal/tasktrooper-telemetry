    MeOrg:
      type: object
      required: [id, name, role, projects]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        projects: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string } } } }
    Me:
      type: object
      required: [orgs, currentProjectId, role, auth]
      properties:
        user: { oneOf: [{ $ref: '#/components/schemas/User' }, { type: "null" }], description: 'null for api keys' }
        orgs: { type: array, items: { $ref: '#/components/schemas/MeOrg' } }
        currentProjectId: { type: string }
        role: { type: string }
        auth: { type: string, enum: [session, apiKey] }
        ai: { $ref: '#/components/schemas/MeAI', description: "Current org's AI usage this month (absent without a current org)" }
    Member:
      type: object
      required: [userId, email, name, role]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        lastLoginAt: { type: integer }
        aiCredits: { $ref: '#/components/schemas/AILimitUsed', description: 'Member monthly cap (null = none) and usage this month' }
    MemberInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
    MemberPatch:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [owner, admin, member, viewer] }
    Project:
      type: object
      required: [id, orgId, name, slug, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string }
        createdAt: { type: integer }
    ProjectInput:
      type: object
      required: [name]
      properties:
        orgId: { type: string, description: "default: the current project's org" }
        name: { type: string }
        slug: { type: string }
    APIKey:
      type: object
      required: [id, name, kind, prefix, allowedOrigins, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ingest, api] }
        prefix: { type: string }
        allowedOrigins: { type: array, items: { type: string } }
        createdAt: { type: integer }
        lastUsedAt: { type: integer }
        revokedAt: { type: integer }
        createdBy: { type: string }
        createdByEmail: { type: string }
        key: { type: string, description: 'Plaintext, only in the create response' }
    APIKeyInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [ingest, api] }
        allowedOrigins: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, at, action, target, meta]
      properties:
        id: { type: string }
        at: { type: integer }
        action: { type: string, description: '"METHOD /route/{pattern}", login, slack.ack, slack.mute' }
        target: { type: string }
        projectId: { type: string }
        userId: { type: string }
        userEmail: { type: string }
        apiKeyId: { type: string }
        apiKeyName: { type: string }
        meta: {}
    InstallURL:
      type: object
      required: [url]
      properties:
        url: { type: string, description: 'Provider URL with a signed state (15 min)' }
    SlackStatus:
      type: object
      required: [installed]
      properties:
        installed: { type: boolean }
        id: { type: string }
        teamId: { type: string }
        teamName: { type: string }
        installedAt: { type: integer }
    SlackChannel:
      type: object
      required: [id, name, isPrivate, isMember]
      properties:
        id: { type: string }
        name: { type: string }
        isPrivate: { type: boolean }
        isMember: { type: boolean }
    GitHubInstall:
      type: object
      required: [id, installationId, account, accountType, status, createdAt]
      properties:
        id: { type: string, description: 'integration id' }
        installationId: { type: string }
        account: { type: string }
        accountType: { type: string }
        status: { type: string }
        createdAt: { type: integer }
    GitHubRepo:
      type: object
      required: [fullName, defaultBranch, private, language, added]
      properties:
        fullName: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
        language: { type: string }
        added: { type: boolean }
    AILimitUsed:
      type: object
      required: [limit, used]
      properties:
        limit: { type: [number, "null"], description: 'null = no limit' }
        used: { type: number }
    AIUsage:
      type: object
      required: [period, resetsAt, plan, org, me, byUser, byFeature, byProject, daily]
      properties:
        period: { type: string, description: 'YYYY-MM (UTC)' }
        resetsAt: { type: integer, description: 'Unix ms of the next month start' }
        plan: { type: string }
        org:
          type: object
          required: [limit, used, remaining]
          properties:
            limit: { type: [number, "null"], description: 'null = unlimited' }
            used: { type: number }
            remaining: { type: [number, "null"] }
        me: { $ref: '#/components/schemas/AILimitUsed' }
        byUser:
          type: array
          items:
            type: object
            required: [userId, email, name, limit, used]
            properties:
              userId: { type: string }
              email: { type: string }
              name: { type: string }
              limit: { type: [number, "null"] }
              used: { type: number }
        byFeature:
          type: array
          items: { type: object, required: [feature, credits, calls], properties: { feature: { type: string }, credits: { type: number }, calls: { type: integer } } }
        byProject:
          type: array
          items: { type: object, required: [projectId, name, credits], properties: { projectId: { type: string }, name: { type: string }, credits: { type: number } } }
        daily: { $ref: '#/components/schemas/SeriesSet' }
        aiQuota: { $ref: '#/components/schemas/AIQuota', description: 'Stored org settings (admin+ only)' }
    MeAI:
      type: object
      required: [period, limit, used, userLimit, userUsed]
      properties:
        period: { type: string }
        limit: { type: [number, "null"] }
        used: { type: number }
        userLimit: { type: [number, "null"] }
        userUsed: { type: number }
    AIQuotaInput:
      type: object
      properties:
        monthlyCredits: { type: [integer, "null"], minimum: -1, description: 'null = plan default (TT_AI_PLAN_CREDITS), -1 = unlimited' }
        notify: { type: array, items: { type: string }, description: 'Monitor channel format (slack:<id>#name, email:<address>); omitted = keep' }
    AIQuota:
      type: object
      required: [orgId, monthlyCredits, notify]
      properties:
        orgId: { type: string }
        monthlyCredits: { type: [integer, "null"] }
        notify: { type: array, items: { type: string } }
    MemberAIQuotaInput:
      type: object
      properties:
        monthlyCredits: { type: [integer, "null"], minimum: 0, description: 'null = no member cap' }
    MemberAIQuota:
      type: object
      required: [orgId, userId, monthlyCredits]
      properties:
        orgId: { type: string }
        userId: { type: string }
        monthlyCredits: { type: [integer, "null"] }
    InfraStatus: { type: string, enum: [ok, warning, critical, stale] }
    Host:
      type: object
      required: [id, hostId, os, arch, cluster, node, cpu, cpuCores, memory, memoryBytes, disk, netIn, netOut, load1, uptimeS, containers, lastSeen, status, spark]
      properties:
        id: { type: string, description: host.name }
        hostId: { type: string }
        os: { type: string }
        arch: { type: string }
        cluster: { type: string, description: "'' = not Kubernetes" }
        node: { type: string }
        cpu: { type: number, description: 0..1 }
        cpuCores: { type: number }
        memory: { type: number, description: 0..1 }
        memoryBytes: { type: number }
        disk: { type: number, description: '0..1 (fullest filesystem)' }
        netIn: { type: number, description: bytes/s }
        netOut: { type: number }
        load1: { type: number }
        uptimeS: { type: number }
        containers: { type: integer }
        lastSeen: { type: integer }
        status: { $ref: '#/components/schemas/InfraStatus' }
        spark: { type: object, required: [cpu, memory], properties: { cpu: { type: array, items: { type: number } }, memory: { type: array, items: { type: number } } } }
    HostDetail:
      allOf:
        - { $ref: '#/components/schemas/Host' }
        - type: object
          required: [series, containerList, processes, services]
          properties:
            series:
              type: object
              required: [cpu, memory, disk, network]
              properties:
                cpu: { $ref: '#/components/schemas/SeriesSet' }
                memory: { $ref: '#/components/schemas/SeriesSet' }
                disk: { $ref: '#/components/schemas/SeriesSet' }
                network: { $ref: '#/components/schemas/SeriesSet' }
            containerList: { type: array, items: { $ref: '#/components/schemas/Container' } }
            processes:
              type: array
              items:
                type: object
                required: [pid, exe, command, containerId, cpu, memoryBytes, threads, fds]
                properties:
                  pid: { type: integer }
                  exe: { type: string }
                  command: { type: string }
                  containerId: { type: string }
                  cpu: { type: number, description: cores }
                  memoryBytes: { type: number }
                  threads: { type: number }
                  fds: { type: number }
            services: { type: array, items: { type: string } }
    Container:
      type: object
      required: [id, name, image, host, cluster, namespace, pod, podUid, service, cpu, cpuLimit, memoryBytes, memoryLimit, restarts, netIn, netOut, throttled, status]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        host: { type: string }
        cluster: { type: string }
        namespace: { type: string }
        pod: { type: string }
        podUid: { type: string }
        service: { type: string }
        cpu: { type: number, description: cores }
        cpuLimit: { type: number }
        memoryBytes: { type: number }
        memoryLimit: { type: number }
        restarts: { type: number }
        netIn: { type: number }
        netOut: { type: number }
        throttled: { type: number, description: 0..1 }
        status: { $ref: '#/components/schemas/InfraStatus' }
    K8sCluster:
      type: object
      required: [name, nodes, nodesReady, pods, podsRunning, podsFailing, namespaces, workloads, cpuUsed, cpuAllocatable, memoryUsed, memoryAllocatable, warningEvents, lastSeen, status]
      properties:
        name: { type: string }
        nodes: { type: integer }
        nodesReady: { type: integer }
        pods: { type: integer }
        podsRunning: { type: integer }
        podsFailing: { type: integer }
        namespaces: { type: integer }
        workloads: { type: integer }
        cpuUsed: { type: number }
        cpuAllocatable: { type: number }
        memoryUsed: { type: number }
        memoryAllocatable: { type: number }
        warningEvents: { type: integer }
        lastSeen: { type: integer }
        status: { $ref: '#/components/schemas/InfraStatus' }
    K8sClusterDetail:
      allOf:
        - { $ref: '#/components/schemas/K8sCluster' }
        - type: object
          required: [nodeList, namespaceList, series]
          properties:
            nodeList:
              type: array
              items:
                type: object
                required: [name, ready, cpu, cpuAllocatable, memoryBytes, memoryAllocatable, pods, host, status]
                properties:
                  name: { type: string }
                  ready: { type: boolean }
                  cpu: { type: number }
                  cpuAllocatable: { type: number }
                  memoryBytes: { type: number }
                  memoryAllocatable: { type: number }
                  pods: { type: integer }
                  host: { type: string }
                  status: { $ref: '#/components/schemas/InfraStatus' }
            namespaceList:
              type: array
              items: { type: object, required: [name, pods, workloads, failing], properties: { name: { type: string }, pods: { type: integer }, workloads: { type: integer }, failing: { type: integer } } }
            series: { $ref: '#/components/schemas/ResourceSeries' }
    ResourceSeries:
      type: object
      required: [cpu, memory]
      properties:
        cpu: { $ref: '#/components/schemas/SeriesSet' }
        memory: { $ref: '#/components/schemas/SeriesSet' }
    K8sWorkload:
      type: object
      required: [cluster, namespace, kind, name, desired, ready, available, updated, restarts, cpu, memoryBytes, service, status]
      properties:
        cluster: { type: string }
        namespace: { type: string }
        kind: { type: string, enum: [Deployment, StatefulSet, DaemonSet, Job, CronJob] }
        name: { type: string }
        desired: { type: number }
        ready: { type: number }
        available: { type: number }
        updated: { type: number }
        restarts: { type: number }
        cpu: { type: number }
        memoryBytes: { type: number }
        service: { type: string }
        status: { $ref: '#/components/schemas/InfraStatus' }
    Pod:
      type: object
      required: [uid, name, namespace, cluster, node, phase, reason, ready, restarts, restartsInRange, cpu, cpuRequest, cpuLimit, memoryBytes, memoryRequest, memoryLimit, workloadKind, workload, service, status, containers]
      properties:
        uid: { type: string }
        name: { type: string }
        namespace: { type: string }
        cluster: { type: string }
        node: { type: string }
        phase: { type: string }
        reason: { type: string }
        ready: { type: boolean }
        restarts: { type: number }
        restartsInRange: { type: number }
        cpu: { type: number }
        cpuRequest: { type: number }
        cpuLimit: { type: number }
        memoryBytes: { type: number }
        memoryRequest: { type: number }
        memoryLimit: { type: number }
        workloadKind: { type: string }
        workload: { type: string }
        service: { type: string }
        status: { $ref: '#/components/schemas/InfraStatus' }
        lastSeen: { type: integer }
        containers:
          type: array
          items: { type: object, required: [name, image, cpu, memoryBytes, restarts], properties: { name: { type: string }, image: { type: string }, cpu: { type: number }, memoryBytes: { type: number }, restarts: { type: number } } }
    PodDetail:
      allOf:
        - { $ref: '#/components/schemas/Pod' }
        - type: object
          required: [series, events]
          properties:
            series:
              type: object
              required: [cpu, memory, restarts]
              properties:
                cpu: { $ref: '#/components/schemas/SeriesSet' }
                memory: { $ref: '#/components/schemas/SeriesSet' }
                restarts: { $ref: '#/components/schemas/SeriesSet', description: 'Restart increase per bucket' }
            events: { type: array, items: { $ref: '#/components/schemas/K8sEvent' } }
    K8sEvent:
      type: object
      required: [ts, type, reason, message, objectKind, objectName, namespace, cluster, count]
      properties:
        ts: { type: integer }
        type: { type: string }
        reason: { type: string }
        message: { type: string }
        objectKind: { type: string }
        objectName: { type: string }
        namespace: { type: string }
        cluster: { type: string }
        count: { type: integer }
    ServiceInfra:
      type: object
      required: [pods, hosts, containers, functions]
      properties:
        pods: { type: array, items: { $ref: '#/components/schemas/Pod' } }
        hosts: { type: array, items: { type: object, required: [id, cpu, memory], properties: { id: { type: string }, cpu: { type: number }, memory: { type: number } } } }
        containers: { type: array, items: { $ref: '#/components/schemas/Container' } }
        functions: { type: array, items: { type: object, required: [id, name, provider], properties: { id: { type: string }, name: { type: string }, provider: { type: string } } } }
    ServerlessSummary:
      type: object
      required: [functions, invocations, errors, errorRate, throttles, coldStarts, costUsd, byProvider]
      properties:
        functions: { type: integer }
        invocations: { type: number }
        errors: { type: number }
        errorRate: { type: number }
        throttles: { type: number }
        coldStarts: { type: number }
        costUsd: { type: number }
        byProvider:
          type: array
          items: { type: object, required: [provider, functions, invocations, costUsd], properties: { provider: { type: string }, functions: { type: integer }, invocations: { type: number }, costUsd: { type: number } } }
    ServerlessFunction:
      type: object
      required: [id, slug, name, provider, app, region, runtime, memoryMb, timeoutS, arch, triggers, service, invocations, errors, errorRate, throttles, p95Ms, p99Ms, coldStarts, coldStartRate, concurrencyMax, costUsd, status, spark]
      properties:
        id: { type: string }
        slug: { type: string, description: 'aws-<region>-<name> | azure-<app>' }
        name: { type: string }
        provider: { type: string, enum: [aws, azure] }
        app: { type: string }
        region: { type: string }
        runtime: { type: string }
        memoryMb: { type: [integer, "null"] }
        timeoutS: { type: [integer, "null"] }
        arch: { type: string }
        triggers: { type: array, items: { type: string } }
        service: { type: string }
        invocations: { type: number }
        errors: { type: number }
        errorRate: { type: number }
        throttles: { type: number }
        p95Ms: { type: number }
        p99Ms: { type: number }
        coldStarts: { type: number, description: 'Entry spans with faas.coldstart=true' }
        coldStartRate: { type: number }
        concurrencyMax: { type: number }
        costUsd: { type: number, description: 'Estimate (TT_FAAS_* prices)' }
        status: { type: string, enum: [ok, warning, critical, idle, missing] }
        spark: { type: array, items: { type: number }, description: 'Invocations per bucket' }
    ServerlessFunctionDetail:
      allOf:
        - { $ref: '#/components/schemas/ServerlessFunction' }
        - type: object
          required: [series, recentErrors, integration]
          properties:
            series:
              type: object
              required: [invocations, duration, concurrency, coldStarts]
              properties:
                invocations: { $ref: '#/components/schemas/SeriesSet' }
                duration: { $ref: '#/components/schemas/SeriesSet' }
                concurrency: { $ref: '#/components/schemas/SeriesSet' }
                coldStarts: { $ref: '#/components/schemas/SeriesSet' }
            recentErrors:
              type: array
              items: { type: object, required: [ts, traceId, message], properties: { ts: { type: integer }, traceId: { type: string }, message: { type: string } } }
            functions: { type: array, items: { type: string }, description: 'Azure: the Function App functions' }
            integration: { oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: "null" }] }
    MonitorTemplate:
      type: object
      required: [id, name, description, kind, severity, query, condition]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [infra, faas] }
        severity: { type: string }
        query: { type: object }
        condition: { type: object }
