        '500': { $ref: '#/components/responses/E500' }
  /api/v1/maintenance-windows/{id}:
    parameters:
      - { name: id, in: path, required: true, description: 'Id', schema: { type: string } }
    get:
      tags: [Alerting]
      operationId: getMaintenanceWindowsId
      summary: 'One maintenance window'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindow' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    put:
      tags: [Alerting]
      operationId: putMaintenanceWindowsId
      summary: 'Replace a maintenance window'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindowInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindow' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    delete:
      tags: [Alerting]
      operationId: deleteMaintenanceWindowsId
      summary: 'Delete a maintenance window'
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/notification-channels:
    get:
      tags: [Alerting]
      operationId: getNotificationChannels
      summary: 'Notification channels; secret config fields are returned as their reference (secret:<id>)'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Alerting]
      operationId: postNotificationChannels
      summary: 'Create a channel. Plain values of webhookUrl (slack, teams), routingKey (pagerduty), apiKey (opsgenie), secret (webhook) are sealed into the secrets table; env:/file:/secret: references are kept'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannelInput' } } }
      responses:
        '201':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
        '409': { $ref: '#/components/responses/E409' }
  /api/v1/notification-channels/{id}:
    parameters:
      - { name: id, in: path, required: true, description: 'Id', schema: { type: string } }
    get:
      tags: [Alerting]
      operationId: getNotificationChannelsId
      summary: 'One channel'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    put:
      tags: [Alerting]
      operationId: putNotificationChannelsId
      summary: 'Replace a channel; omitted / empty secret fields keep the stored secret, new values rotate it'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannelInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
        '409': { $ref: '#/components/responses/E409' }
    delete:
      tags: [Alerting]
      operationId: deleteNotificationChannelsId
      summary: 'Delete a channel and its secrets'
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: getIntegrations
      summary: 'Cloud integrations with the resources they discovered (databases, clusters, queues, deploy projects)'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Integration' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Integrations]
      operationId: postIntegrations
      summary: 'Connect a provider. `secret` (access key JSON, service-account JSON, token, API key) is sealed (AES-256-GCM, AAD = project id) and never returned'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationInput' } } }
      responses:
        '201':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Integration' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
        '409': { $ref: '#/components/responses/E409' }
  /api/v1/integrations/test:
    post:
      tags: [Integrations]
      operationId: postIntegrationsTest
      summary: 'Check credentials without saving: AWS STS GetCallerIdentity (+ AssumeRole), GCP token + Resource Manager, Vercel /v2/user, Neon /api/v2/projects (10 s timeout; never echoes the secret)'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationInput' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationTestResult' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
        '501': { description: Not configured, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/integrations/{id}:
    parameters:
      - { name: id, in: path, required: true, description: 'Id', schema: { type: string } }
    get:
      tags: [Integrations]
      operationId: getIntegrationsId
      summary: 'One integration'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Integration' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    patch:
      tags: [Integrations]
      operationId: patchIntegrationsId
      summary: 'Rename, merge config (null removes a key), disable / re-enable (status), or rotate the secret'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationPatch' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Integration' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
        '409': { $ref: '#/components/responses/E409' }
    delete:
      tags: [Integrations]
      operationId: deleteIntegrationsId
      summary: 'Delete an integration and its secrets; discovered rows keep their data with integrationId unset'
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/integrations/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, description: 'Id', schema: { type: string } }
    post:
      tags: [Integrations]
      operationId: postIntegrationsIdSync
      summary: 'Request an out-of-schedule sync: stamps config.syncRequestedAt, which trooper-cloud polls'
      responses:
        '202':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Integration' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "Project API key (kind = api), e.g. tt_dev_api_key" }
  parameters:
    range: { name: range, in: query, description: "Time range (default 1h)", schema: { type: string, enum: [1h, 6h, 24h, 7d], default: 1h } }
    env: { name: env, in: query, description: "Deployment environment filter", schema: { type: string } }
    type: { name: type, in: query, description: "Service types, comma separated (http | worker | web | mobile)", schema: { type: string } }
    service: { name: service, in: query, description: "Service name (repeatable / comma separated on /logs)", schema: { type: string } }
    serviceId: { name: serviceId, in: query, schema: { type: string } }
    endpoint: { name: endpoint, in: query, description: '"METHOD /route" or a process name', schema: { type: string } }
    errors: { name: errors, in: query, description: "Only failed traces", schema: { type: boolean } }
    minMs: { name: minMs, in: query, description: "Minimum duration (ms)", schema: { type: number } }
    sort: { name: sort, in: query, schema: { type: string, enum: [recent, slowest] } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1 } }
    route: { name: route, in: query, schema: { type: string } }
    status: { name: status, in: query, schema: { type: string, enum: [open, resolved, ignored] } }
    level: { name: level, in: query, description: "error | warn | info | debug (repeatable / comma separated)", schema: { type: string } }
    q: { name: q, in: query, description: "Full-text search (single token uses the token index)", schema: { type: string } }
    traceId: { name: traceId, in: query, schema: { type: string } }
    before: { name: before, in: query, description: "Cursor: nextBefore of the previous page (unix µs)", schema: { type: integer } }
    view: { name: view, in: query, description: "Page / screen name", schema: { type: string } }
    kind: { name: kind, in: query, schema: { type: string } }
    clusterId: { name: clusterId, in: query, schema: { type: string } }
    group: { name: group, in: query, schema: { type: string } }
    state: { name: state, in: query, description: "open = not resolved (pending included)", schema: { type: string, enum: [open, pending, firing, acknowledged, resolved] } }
    deploySource: { name: source, in: query, schema: { type: string, enum: [spans, vercel, ci, manual, aws, gcp] } }
    monitorId: { name: monitorId, in: query, schema: { type: string } }
    kpiId: { name: kpiId, in: query, schema: { type: string } }
    since: { name: since, in: query, description: "Unix ms", schema: { type: integer } }
    metric: { name: metric, in: query, required: true, schema: { type: string, enum: [cpu, memory, disk, connections, ops, p95, hit, repl, slow, evictions] } }
    brokerMetric: { name: metric, in: query, required: true, schema: { type: string, enum: [cpu, memory, disk, net] } }
    node: { name: node, in: query, schema: { type: string } }
    topic: { name: topic, in: query, schema: { type: string } }
    by: { name: by, in: query, schema: { type: string, enum: [topic, partition] } }
    scenarioId: { name: scenarioId, in: query, schema: { type: string } }
  responses:
    E400: { description: Invalid parameter or body, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E401: { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E404: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E409: { description: Conflict (duplicate id or invalid state transition), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    E500: { description: Internal error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    CodeSuggestion:
      type: object
      required: [id, title, kind, target, condition, criticality, confidence, rationale, codeRef, calibrated]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, description: 'Monitor kind' }
        target: { type: string }
        condition: { type: string }
        criticality: { type: string }
        confidence: { type: number }
        rationale: { type: string }
        codeRef: { type: string }
        calibrated: { type: boolean }
    Repo:
      type: object
      required: [id, name, branch, sha, analyzedAt, services, language, status]
      properties:
        id: { type: string }
        name: { type: string }
        branch: { type: string }
        sha: { type: string }
        analyzedAt: { type: integer, format: int64 }
        services: { type: array, items: { type: string } }
        language: { type: string }
        status: { type: string, enum: [ready, analyzing, error] }
    InventoryItem:
      type: object
      required: [id, kind, key, service, file, line, criticality, observed, monitored]
      properties:
        id: { type: string }
        kind: { type: string, enum: [endpoint, consumer, cron, view, dependency] }
        key: { type: string, description: '"METHOD /route" or process name' }
        source: { type: string, description: 'Consumer: topic/queue; cron: schedule' }
        service: { type: string }
        file: { type: string }
        line: { type: integer }
        criticality: { type: string }
        observed: { type: boolean }
        monitored: { type: boolean }
    RcaStats:
      type: object
      required: [requests, rpm, avgMs, p50, p95, errorRate]
      properties:
        requests: { type: number }
        rpm: { type: number }
        avgMs: { type: number }
        p50: { type: number }
        p95: { type: number }
        errorRate: { type: number }
    RcaChildStats:
      type: object
      required: [calls, callsPerMin, callsPerReq, msPerReq, avgMs, p50, p95, errorRate]
      properties:
        calls: { type: number }
        callsPerMin: { type: number }
        callsPerReq: { type: number }
        msPerReq: { type: number, description: 'Dependency time per endpoint request' }
        avgMs: { type: number }
        p50: { type: number }
        p95: { type: number }
        errorRate: { type: number }
    RcaChild:
      type: object
      required: [dep, kind, current, baseline, deltaMsPerReq, share]
      properties:
        dep: { type: string }
        kind: { type: string, enum: [db, cache, http, queue] }
        current: { $ref: '#/components/schemas/RcaChildStats' }
        baseline: { $ref: '#/components/schemas/RcaChildStats' }
        deltaMsPerReq: { type: number, description: 'current − baseline ms per request' }
        share: { type: number, description: 'deltaMsPerReq / deltaAvgMs (0 when the average did not change)' }
    EndpointRca:
      type: object
      required: [service, endpoint, from, to, baselineFrom, baselineTo, current, baseline, ownMs, deltaAvgMs, children]
      properties:
        service: { type: string }
        endpoint: { type: string, description: '"METHOD /route" or process name' }
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        baselineFrom: { type: integer, format: int64 }
        baselineTo: { type: integer, format: int64 }
        current: { $ref: '#/components/schemas/RcaStats' }
        baseline: { $ref: '#/components/schemas/RcaStats' }
        ownMs: { type: array, minItems: 2, maxItems: 2, items: { type: number }, description: 'Own-code ms per request [current, baseline] = avg − Σ dependency ms (≥ 0)' }
        deltaAvgMs: { type: number }
        children: { type: array, items: { $ref: '#/components/schemas/RcaChild' }, description: 'Sorted by deltaMsPerReq descending' }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health_:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string }
    Health:
      type: string
      enum: [ok, warning, critical]
    ErrorStatusInput:
      type: object
      required: [status]
      properties:
        fingerprint: { type: string }
        status: { type: string, enum: [open, resolved, ignored] }
    Series:
      type: object
      required: [id, label, data]
      properties:
        id: { type: string }
        label: { type: string }
        data: { type: array, items: { type: number } }
    SeriesSet:
      type: object
      required: [timestamps, series]
      properties:
        timestamps: { type: array, items: { type: integer } }
        series: { type: array, items: { $ref: '#/components/schemas/Series' } }
    Service:
      type: object
      required: [id, name, type, language, version, rpm, errorRate, p95, prevRpm, prevErrorRate, prevP95, status, instances]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        language: { type: string }
        version: { type: string }
        rpm: { type: number }
        errorRate: { type: number }
        p95: { type: number }
        prevRpm: { type: number }
        prevErrorRate: { type: number }
        prevP95: { type: number }
        status: { $ref: '#/components/schemas/Health' }
        instances: { type: integer }
        lag: { type: number, description: "Consumer services only (summed group lag); omitted otherwise" }
        spark: { type: array, items: { type: number } }
    Subscription:
      type: object
      required: [process, source, topic, lag, retriesPerMin, dlqPerMin]
      properties:
        process: { type: string }
        source: { type: string }
        topic: { type: string }
        group: { type: string }
        partitions: { type: integer }
        schedule: { type: string }
        lag: { type: number }
        retriesPerMin: { type: number }
        dlqPerMin: { type: number }
    Endpoint:
      type: object
      required: [id, serviceId, method, route, rpm, errorRate, p50, p95, p99, monitored, criticality]
      properties:
        id: { type: string }
        serviceId: { type: string }
        method: { type: string }
        route: { type: string }
        rpm: { type: number }
        errorRate: { type: number }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
        monitored: { type: boolean }
        criticality: { type: string }
        sub: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: "null" }] }
        status: { oneOf: [{ $ref: '#/components/schemas/StatusCounts' }, { type: "null" }] }
        spark: { type: array, items: { type: number } }
    StatusCounts:
      type: object
      required: [s2xx, s3xx, s4xx, s5xx]
      properties:
        s2xx: { type: number }
        s3xx: { type: number }
        s4xx: { type: number }
        s5xx: { type: number }
    Dependency:
      type: object
      required: [id, serviceId, name, kind, avgMs, p95, errorRate, callsPerMin]
      properties:
        id: { type: string }
        serviceId: { type: string }
        name: { type: string }
        kind: { type: string }
        avgMs: { type: number }
        p95: { type: number }
        errorRate: { type: number }
        callsPerMin: { type: number }
    EndpointCall:
      type: object
      required: [dep, callsPerReq, msPerReq]
      properties:
        dep: { $ref: '#/components/schemas/Dependency' }
        callsPerReq: { type: number }
        msPerReq: { type: number }
    TimeBreakdown:
      type: object
      required: [avgMs, parts]
      properties:
        avgMs: { type: number }
        parts: { type: object, additionalProperties: { type: number } }
    Caller:
      type: object
      required: [id, name, kind, via]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        via: { type: string }
    CallerTraffic:
      type: object
      required: [caller, rpm, share, errorRate, p95]
      properties:
        caller: { $ref: '#/components/schemas/Caller' }
        rpm: { type: number }
        share: { type: number }
        errorRate: { type: number }
        p95: { type: number }
        topEndpoint: { oneOf: [{ $ref: '#/components/schemas/Endpoint' }, { type: "null" }] }
    TraceSummary:
      type: object
      required: [id, ts, dur, status, service, method, route, isError]
      properties:
        id: { type: string }
        ts: { type: integer }
        dur: { type: number }
        status: { type: integer }
        service: { type: string }
        method: { type: string }
        route: { type: string }
        isError: { type: boolean }
    Span:
      type: object
      required: [spanId, service, name, kind, category, start, dur, status, failed]
      properties:
        spanId: { type: string }
        parentSpanId: { type: string }
        service: { type: string }
        name: { type: string }
        kind: { type: string }
        category: { type: string }
        start: { type: number }
        dur: { type: number }
        status: { type: integer }
        failed: { type: boolean }
        dep: { type: string }
        route: { type: string }
        errorType: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
    Trace:
      type: object
      required: [id, ts, dur, services, errors, spans]
      properties:
        id: { type: string }
        ts: { type: integer }
        dur: { type: number }
        services: { type: array, items: { type: string } }
        errors: { type: integer }
        spans: { type: array, items: { $ref: '#/components/schemas/Span' } }
    ErrorIssue:
      type: object
      required: [fingerprint, service, type, message, route, firstSeen, lastSeen, count, status]
      properties:
        fingerprint: { type: string }
        service: { type: string }
        type: { type: string }
        message: { type: string }
        route: { type: string }
        firstSeen: { type: integer }
        lastSeen: { type: integer }
        count: { type: number }
        sampleTraceId: { type: string }
        status: { type: string }
    DeployMarker:
      type: object
      required: [service, env, version, ts, source]
      properties:
        service: { type: string }
        env: { type: string }
        version: { type: string }
        ts: { type: integer }
        source: { type: string, enum: [spans, vercel, ci, manual, aws, gcp] }
        url: { type: string }
        commitMessage: { type: string }
        author: { type: string }
        state: { type: string, enum: [building, ready, error, canceled] }
        integrationId: { type: string }
    Frame:
      type: object
      required: [fn, file, line, col, inApp]
      properties:
        fn: { type: string }
        file: { type: string }
        line: { type: integer }
        col: { type: integer }
        inApp: { type: boolean }
    ErrorDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorIssue'
        - type: object
          required: [release, platform, stack, frames, symbolicated]
