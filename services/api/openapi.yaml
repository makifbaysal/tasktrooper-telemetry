openapi: 3.1.0
info:
  title: TaskTrooper Telemetry API
  version: 1.0.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: |
    Query API behind the dashboard (apps/web). Single source of truth for the HTTP contract (.ai/contracts.md).

    * Auth: `Authorization: Bearer <api key>` (api_keys.kind = 'api'); the key selects org + project. Every query is tenant-scoped.
    * JSON, camelCase. Times are unix ms, durations ms, ratios 0..1.
    * Series are `{timestamps, series: [{id, label, data}]}`, zero-filled, one point per bucket:
      1h → 60×1m, 6h → 72×5m, 24h → 96×15m, 7d → 84×2h (red_1m for ≤ 24h, red_1h for 7d). The last bucket contains now.
    * Errors: `{"error": "..."}` with 400 (validation), 401, 404, 409 (state conflict / duplicate id), 500.
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
tags:
  - { name: System, description: "Health check" }
  - { name: APM, description: "Services, endpoints, processes, RED series, callers, dependencies, deploys" }
  - { name: Traces, description: "Trace search/detail and error issues" }
  - { name: Logs, description: "Log search, volume and patterns" }
  - { name: RUM, description: "Web and mobile apps" }
  - { name: Alerting, description: "Monitors, previews and incidents" }
  - { name: KPIs, description: "SLOs, error budgets and burn-rate rules" }
  - { name: Infrastructure, description: "Databases and message brokers" }
  - { name: Load tests, description: "Scenarios and runs" }
  - { name: Internal, description: "Service-to-service endpoints (collector)" }
  - { name: Integrations, description: "Cloud integrations (AWS, Google Cloud, Vercel, Neon — ADR-012)" }
  - { name: Code insights, description: "Repo analysis, code inventory and monitor suggestions (no backend yet: empty lists)" }
paths:
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      summary: Liveness + Postgres/ClickHouse ping (no auth)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health_' } } } }
        '503': { description: A dependency is down, content: { application/json: { schema: { $ref: '#/components/schemas/Health_' } } } }
  /api/v1/overview/series:
    get:
      tags: [APM]
      operationId: getOverviewSeries
      summary: 'Project-wide RED series (rpm, errorRate, p50/p95/p99, s2xx..s5xx)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services:
    get:
      tags: [APM]
      operationId: getServices
      summary: 'Services (http, worker, web, mobile) with RED summary and sparkline'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/type'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Service' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesService
      summary: 'One service'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Service' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceSeries
      summary: 'RED series of a service'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpoints
      summary: 'Endpoints (HTTP) or processes (consumers) of a service'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Endpoint' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/callers:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceCallers
      summary: 'Incoming traffic by caller'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CallerTraffic' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/callers/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceCallersSeries
      summary: 'Request rate per caller'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/dependencies:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceDependencies
      summary: 'Outgoing dependencies ("<system> · <name>")'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dependency' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/dependencies/{dep}/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: dep, in: path, required: true, description: 'Dependency name, e.g. "postgres · orders-db"', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceDependenciesDepSeries
      summary: 'Calls, errors and latency of one dependency'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/breakdown:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceBreakdown
      summary: 'Where time goes (app vs. db/cache/http/queue)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TimeBreakdown' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/breakdown/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceBreakdownSeries
      summary: 'Time breakdown over time'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/deploys:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceDeploys
      summary: 'Deploy markers of a service (spans + deploy_markers)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/deploySource'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeployMarker' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpoint
      summary: 'One endpoint or process (id = UI endpoint id, process name)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Endpoint' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointSeries
      summary: 'RED series of an endpoint (processes add retried, dlq)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/callers:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointCallers
      summary: 'Callers of an endpoint (producers for processes)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CallerTraffic' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/callers/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointCallersSeries
      summary: 'Request rate per caller of an endpoint'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/calls:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointCalls
      summary: 'Downstream calls made per request'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EndpointCall' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/breakdown:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointBreakdown
      summary: 'Time breakdown of an endpoint'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TimeBreakdown' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/breakdown/series:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointBreakdownSeries
      summary: 'Time breakdown of an endpoint over time'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/SeriesSet' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/services/{service}/endpoints/{endpoint}/rca:
    parameters:
      - { name: service, in: path, required: true, description: 'Service name', schema: { type: string } }
      - { name: endpoint, in: path, required: true, description: 'Endpoint id (e.g. get-orders-id) or process name', schema: { type: string } }
    get:
      tags: [APM]
      operationId: getServicesServiceEndpointsEndpointRca
      summary: 'Root-cause baseline: the endpoint and each dependency (edges_1m) in the range vs a baseline window'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - { name: baseline, in: query, required: false, description: 'prev (default, the window just before) | 1d | 7d (same window shifted back)', schema: { type: string, enum: [prev, 1d, 7d] } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/EndpointRca' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/suggestions:
    get:
      tags: [Code insights]
      operationId: getSuggestions
      summary: 'Monitor suggestions from code analysis (no backend yet: always [])'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CodeSuggestion' } } } }
        '401': { $ref: '#/components/responses/E401' }
  /api/v1/repos:
    get:
      tags: [Code insights]
      operationId: getRepos
      summary: 'Analyzed repositories (no backend yet: always [])'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Repo' } } } }
        '401': { $ref: '#/components/responses/E401' }
  /api/v1/inventory:
    get:
      tags: [Code insights]
      operationId: getInventory
      summary: 'Code inventory: endpoints, consumers, crons, views, dependencies (no backend yet: always [])'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InventoryItem' } } } }
        '401': { $ref: '#/components/responses/E401' }
  /api/v1/deploys:
    get:
      tags: [APM]
      operationId: getDeploys
      summary: 'Deploy markers: versions first seen in spans (source spans) merged with Postgres deploy_markers (Vercel, CI, …), newest first'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/deploySource'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeployMarker' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/traces:
    get:
      tags: [Traces]
      operationId: getTraces
      summary: 'Search traces (entry spans)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/endpoint'
        - $ref: '#/components/parameters/errors'
        - $ref: '#/components/parameters/minMs'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TraceSummary' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/traces/{traceId}:
    parameters:
      - { name: traceId, in: path, required: true, description: '32 hex chars', schema: { type: string } }
    get:
      tags: [Traces]
      operationId: getTracesTraceId
      summary: 'Trace with all spans'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Trace' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/errors:
    get:
      tags: [Traces]
      operationId: getErrors
      summary: 'Error issues (grouped by fingerprint)'
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/service'
        - $ref: '#/components/parameters/route'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ErrorIssue' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
  /api/v1/errors/{fingerprint}:
    parameters:
      - { name: fingerprint, in: path, required: true, description: 'Error fingerprint (uint64 as string)', schema: { type: string } }
    get:
      tags: [Traces]
      operationId: getErrorsFingerprint
      summary: 'Error issue with the stack of its latest occurrence, symbolicated via TT_SYMBOLICATOR_URL (2 s budget; raw stack on failure)'
      parameters:
        - $ref: '#/components/parameters/range'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorDetail' } } }
        '400': { $ref: '#/components/responses/E400' }
        '404': { $ref: '#/components/responses/E404' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }
    patch:
      tags: [Traces]
      operationId: patchErrorsFingerprint
      summary: 'Set error issue status'
      requestBody:
