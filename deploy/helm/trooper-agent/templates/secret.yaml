{{- include "trooper-agent.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trooper-agent.fullname" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.dsn | quote }}
  ingestKey: {{ (urlParse .Values.dsn).userinfo | quote }}
  {{- if .Values.db.enabled }}
  apiKey: {{ .Values.db.apiKey | quote }}
  {{- end }}
{{- end }}
