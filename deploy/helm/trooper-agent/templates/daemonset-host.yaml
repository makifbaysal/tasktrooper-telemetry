{{- if .Values.host.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "trooper-agent.fullname" . }}-host
  labels:
    {{- include "trooper-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: host
spec:
  selector:
    matchLabels: {{- include "trooper-agent.selector" (dict "ctx" . "component" "host") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 25% }
  template:
    metadata:
      labels: {{- include "trooper-agent.selector" (dict "ctx" . "component" "host") | nindent 8 }}
      annotations:
        checksum/secret: {{ printf "%s%s" .Values.dsn .Values.existingSecret | sha256sum }}
        {{- with .Values.host.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "trooper-agent.serviceAccountName" . }}
      # host processes (top-N, container ids from /proc/<pid>/cgroup)
      hostPID: true
      {{- with .Values.host.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: trooper-agent
          image: {{ include "trooper-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TT_AGENT_MODES
              value: host
            {{- include "trooper-agent.commonEnv" . | nindent 12 }}
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - { name: TT_AGENT_PROCFS, value: /host/proc }
            - { name: HOST_SYS, value: /host/sys }
            - { name: TT_AGENT_ROOTFS, value: /host/root }
            - name: TT_AGENT_TOP_PROCESSES
              value: {{ .Values.host.topProcesses | quote }}
            - name: TT_KUBELET_INSECURE
              value: {{ .Values.host.kubelet.insecureSkipVerify | quote }}
            {{- with .Values.host.gpu.nvidiaSmi }}
            - name: TT_AGENT_NVIDIA_SMI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.host.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # root to read other processes' /proc entries; no privilege escalation, read-only fs,
          # only the capabilities needed for /proc/<pid>/fd and statfs on host mounts.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [SYS_PTRACE, DAC_READ_SEARCH]
          resources: {{- toYaml .Values.host.resources | nindent 12 }}
          volumeMounts:
            - { name: host-proc, mountPath: /host/proc, readOnly: true }
            - { name: host-sys, mountPath: /host/sys, readOnly: true }
            - { name: host-root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
      volumes:
        - { name: host-proc, hostPath: { path: /proc } }
        - { name: host-sys, hostPath: { path: /sys } }
        - { name: host-root, hostPath: { path: / } }
      {{- with .Values.host.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector: {{- include "trooper-agent.nodeSelector" (dict "user" .Values.host.nodeSelector "os" "linux") | nindent 8 }}
      {{- with .Values.host.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
