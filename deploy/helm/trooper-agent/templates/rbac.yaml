{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trooper-agent.serviceAccountName" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if or .Values.host.enabled .Values.cluster.enabled .Values.windows.enabled }}
# Read-only: host mode reads the kubelet (nodes/stats, nodes/proxy), cluster mode lists objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trooper-agent.fullname" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/stats, nodes/proxy, nodes/metrics, pods, namespaces, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trooper-agent.fullname" . }}
  labels: {{- include "trooper-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trooper-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "trooper-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
