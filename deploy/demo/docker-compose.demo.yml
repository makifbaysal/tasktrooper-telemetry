# Demo deployment on a single machine behind Cloudflare Tunnel (ADR-031, deploy/demo/README.md).
# Layered on the local stack:
#   docker compose -f deploy/docker-compose.yml -f deploy/demo/docker-compose.demo.yml --profile app up -d --build \
#     ingest-gw ingest-writer api alert-engine notifier loadtest codeintel symbolicator web trooper-agent
# Values come from deploy/.env (the deploy-demo workflow writes it from the DEMO_ENV secret). Relative paths resolve against deploy/.
# Self-observability (ADR-027): deploy.sh exports TROOPER_SELF_DSN / TT_SELF_PROJECT_ID from the DEMO_TROOPER_DSN secret (a
# project created in the dashboard; host rewritten to ingest-gw:4318 so self-telemetry never crosses the tunnel); empty = the
# services export nothing and trooper-agent is not started.
x-restart: &restart { restart: unless-stopped }
# public resolvers for outbound calls (GitHub, Slack, LLM): a stale home-router cache must not send them elsewhere
x-dns: &dns [1.1.1.1, 8.8.8.8]
# TT_DEMO_VERSION = git short sha (deploy.sh) → service.version + deploy markers of the self project
# TROOPER_PROFILING: continuous profiles for the Profiling screen (off by default in the SDK)
x-self-env: &self_env { TROOPER_ENV: demo, TROOPER_VERSION: "${TT_DEMO_VERSION:-}", TROOPER_PROFILING: "true" }

services:
  clickhouse: *restart
  postgres: *restart
  redpanda: *restart
  redis: *restart
  s3: *restart
  ingest-gw: { restart: unless-stopped, dns: *dns, environment: *self_env }
  ingest-writer: { restart: unless-stopped, dns: *dns, environment: *self_env }
  alert-engine: { restart: unless-stopped, dns: *dns, environment: *self_env }
  notifier: { restart: unless-stopped, dns: *dns, environment: *self_env }
  # repo analysis (ADR-014) with LLM enrichment through TT_ASSISTANT_* (ADR-034); new repositories are analyzed by the
  # scheduler, push webhooks need a tunnel route to :8096 (not set up)
  # stacks of tt-web (sourcemaps uploaded by deploy.sh) and of customer apps
  symbolicator: { restart: unless-stopped, dns: *dns, environment: *self_env }
  codeintel: { restart: unless-stopped, dns: *dns, environment: *self_env }

  # load tests (ADR-015/032): one machine, so small caps; targets must be verified domains (never this host itself)
  loadtest:
    restart: unless-stopped
    dns: *dns
    environment:
      <<: *self_env
      TT_LOADTEST_ALLOW_LOCAL: "false"
      TT_LOADTEST_MAX_VUS: "50"
      TT_LOADTEST_MAX_DURATION: 15m
      TT_LOADTEST_MAX_CONCURRENT: "1"
      TT_LOADTEST_MONTHLY_VU_MINUTES: "3000"

  api:
    restart: unless-stopped
    dns: *dns
    environment:
      TROOPER_ENV: demo
      TROOPER_VERSION: "${TT_DEMO_VERSION:-}"
      TROOPER_PROFILING: "true"
      # public site: never the dev login
      TT_AUTH_DEV: "false"
      # shared member account (ADR-035, deploy.sh "demo login"); failed attempts limited per visitor IP from Cloudflare
      TT_AUTH_PASSWORD: "true"
      TT_CLIENT_IP_HEADER: CF-Connecting-IP
      TT_COOKIE_SECURE: "true"
      TT_API_CORS_ORIGINS: ${TT_WEB_URL:?set TT_WEB_URL in deploy/.env}
      TT_PUBLIC_INGEST_URL: ${TT_PUBLIC_INGEST_URL:?set TT_PUBLIC_INGEST_URL in deploy/.env}
      TT_OIDC_REDIRECT_URL: ${TT_PUBLIC_API_URL:?set TT_PUBLIC_API_URL in deploy/.env}/api/v1/auth/callback

  # dashboard: static build of apps/web, copied by deploy.sh to TT_DEMO_WEB_DIR (outside the checkout); SPA fallback
  web:
    image: caddy:2.10.0
    restart: unless-stopped
    # folder mount + --watch: a checkout that rewrites the Caddyfile is picked up without recreating the container (a
    # single-file bind mount would keep the old inode)
    command: ["caddy", "run", "--config", "/etc/caddy/demo/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ${TT_DEMO_WEB_DIR:-../apps/web/dist}:/srv:ro
      - ./demo:/etc/caddy/demo:ro

  # the platform's own infra → self project: Postgres, Redis, Redpanda (db) and the Docker VM + containers (host)
  trooper-agent:
    profiles: [self]
    build: { context: .., dockerfile: services/collector/Dockerfile }
    restart: unless-stopped
    dns: *dns
    user: "0"
    pid: host
    command: ["--config", "/etc/trooper/agent.yaml"]
    environment:
      TT_AGENT_MODES: db,host
      TT_DSN: ${TROOPER_SELF_DSN:-}
      TROOPER_DSN: ${TROOPER_SELF_DSN:-}
      TROOPER_ENV: demo
      TROOPER_VERSION: "${TT_DEMO_VERSION:-}"
      TT_SELF_PG_PASSWORD: trooper
      TT_SELF_CH_PASSWORD: trooper
    volumes:
      - ./demo/agent.yaml:/etc/trooper/agent.yaml:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [postgres, clickhouse, redis, redpanda, ingest-gw]
